<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى روح قلبي ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(220, 53, 69, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.5);
        }

        /* Password Screen */
        .login-box h2 {
            color: #d63384;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ffc107;
            border-radius: 30px;
            outline: none;
            text-align: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #d63384;
            box-shadow: 0 0 10px rgba(214, 51, 132, 0.3);
        }

        button {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
        }

        .error-msg {
            color: #dc3545;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* Main Content Screen */
        .content {
            display: none;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .counter-title {
            font-size: 22px;
            font-weight: 700;
            color: #d63384;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .time-box {
            background: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
            padding: 12px 5px;
            border-radius: 16px;
            border: 1px solid #ffb6c1;
        }

        .time-box .number {
            font-size: 24px;
            font-weight: 800;
            color: #c2185b;
            display: block;
        }

        .time-box .label {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        .love-message {
            background: #fff;
            padding: 20px;
            border-radius: 18px;
            border-right: 5px solid #ff416c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            font-size: 19px;
            line-height: 1.8;
            color: #444;
            font-weight: 700;
        }

        .heart-icon {
            font-size: 30px;
            margin-top: 15px;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @media (max-width: 480px) {
            .timer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول / كلمة السر -->
        <div id="loginBox" class="login-box">
            <h2>ادخلي كلمة السر لرؤية المفاجأة 💖</h2>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="أدخلي كلمة السر...">
            </div>
            <button onclick="checkPassword()">دخول</button>
            <p id="errorMsg" class="error-msg">كلمة السر غير صحيحة، حاولي مرة أخرى!</p>
        </div>

        <!-- المحتوى الرئيسي (يظهر بعد كتابة الباسورد) -->
        <div id="mainContent" class="content">
            <div class="counter-title">
                من أول يوم حبيتك فيه ولحد الآن 💕
            </div>

            <div class="timer-grid">
                <div class="time-box">
                    <span id="days" class="number">0</span>
                    <span class="label">يوم</span>
                </div>
                <div class="time-box">
                    <span id="hours" class="number">0</span>
                    <span class="label">ساعة</span>
                </div>
                <div class="time-box">
                    <span id="minutes" class="number">0</span>
                    <span class="label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span id="seconds" class="number">0</span>
                    <span class="label">ثانية</span>
                </div>
            </div>

            <div class="love-message">
                بحبك ي روح قلبي وربنا يديمك ف حياتي
                <br>
                بحبك❣️❣️
            </div>

            <div class="heart-icon">💖</div>
        </div>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("errorMsg");
            
            // التحقق من كلمة السر sara
            if (password === "sara") {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
                startCounter();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function startCounter() {
            // تاريخ البداية: 1 يناير 2023
            const startDate = new Date("2023-01-01T00:00:00").getTime();

            function updateTimer() {
                const now = new Date().getTime();
                const difference = now - startDate;

                // حساب الأيام، الساعات، الدقائق والثواني
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours;
                document.getElementById("minutes").innerText = minutes;
                document.getElementById("seconds").innerText = seconds;
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        // إمكانية الضغط على زر Enter للدخول
        document.getElementById("passwordInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
